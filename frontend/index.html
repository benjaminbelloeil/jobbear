<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A1F19" />
    <link rel="icon" type="image/svg+xml" href="/bear.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>JobBear</title>
    <style>
      /* Boot splash: shown from the first byte until React mounts and replaces #root's
         contents. Plain CSS, because Tailwind isn't loaded yet. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #2a1f19;
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border-radius: 999px;
        background: #f3f4ef;
        animation: boot-bob 1.1s ease-in-out infinite;
      }
      .boot-dots {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 22px;
      }
      .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #e9a825;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) {
        animation-delay: 150ms;
      }
      .boot-dots span:nth-child(3) {
        animation-delay: 300ms;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading JobBear">
        <div>
          <div class="boot-mark">
            <svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
              <circle cx="15" cy="16" r="11" fill="#2a1f19" />
              <circle cx="49" cy="16" r="11" fill="#2a1f19" />
              <circle cx="15" cy="16" r="5" fill="#e9a825" />
              <circle cx="49" cy="16" r="5" fill="#e9a825" />
              <circle cx="32" cy="36" r="24" fill="#2a1f19" />
              <ellipse cx="32" cy="45" rx="11" ry="8.5" fill="#e9a825" />
              <ellipse cx="32" cy="40.5" rx="4.2" ry="3" fill="#2a1f19" />
              <circle cx="23" cy="31" r="2.6" fill="#f3f4ef" />
              <circle cx="41" cy="31" r="2.6" fill="#f3f4ef" />
            </svg>
          </div>
          <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

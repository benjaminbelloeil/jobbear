name: Bug report
description: Something doesn't work the way it should.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend / API, Gmail sync, AI classification, Setup / Docker, Docs]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Chrome 140, self-hosted with Docker"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove email addresses, API keys and tokens before pasting.
      render: shell
